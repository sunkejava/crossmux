name: Compile Release
on:
  push:
    tags:
      - '*'
    branches:
      - 'release/*'

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U pioarduino==6.1.19

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio/.cache
          key: pio-cache-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-cache-${{ runner.os }}-

      - name: Build CrossMux (international + Chinese)
        run: pio run -e gh_release -e gh_release_cn

      - name: Publish CrossMux Sync Service single-file binaries
        run: |
          set -euo pipefail
          PROJECT="sync-service/CrossMux.SyncService/CrossMux.SyncService.csproj"
          dotnet publish "$PROJECT" -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None -p:DebugSymbols=false -o dist/service-win-x64
          dotnet publish "$PROJECT" -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None -p:DebugSymbols=false -o dist/service-linux-x64
          test -f dist/service-win-x64/CrossMux.SyncService.exe
          test -f dist/service-linux-x64/CrossMux.SyncService
          chmod +x dist/service-linux-x64/CrossMux.SyncService
          (cd dist/service-win-x64 && zip -9 ../CrossMux.SyncService-win-x64.zip CrossMux.SyncService.exe)
          tar -C dist/service-linux-x64 -czf dist/CrossMux.SyncService-linux-x64.tar.gz CrossMux.SyncService
          rm -rf dist/service-win-x64 dist/service-linux-x64

      - name: Stage release assets
        run: |
          mkdir -p dist
          cp .pio/build/gh_release/firmware.bin     dist/firmware.bin
          cp .pio/build/gh_release/bootloader.bin   dist/bootloader.bin
          cp .pio/build/gh_release/partitions.bin   dist/partitions.bin
          cp .pio/build/gh_release_cn/firmware.bin  dist/firmware-cn.bin
          sha256sum dist/firmware.bin dist/firmware-cn.bin dist/bootloader.bin dist/partitions.bin \
            dist/CrossMux.SyncService-win-x64.zip dist/CrossMux.SyncService-linux-x64.tar.gz > dist/SHA256SUMS.txt

      - name: Upload release build
        uses: actions/upload-artifact@v4
        with:
          name: release-build
          path: |
            dist/*
            .pio/build/gh_release/bootloader.bin
            .pio/build/gh_release/firmware.bin
            .pio/build/gh_release/firmware.elf
            .pio/build/gh_release/firmware.map
            .pio/build/gh_release/partitions.bin
            .pio/build/gh_release_cn/firmware.bin
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  publish-release:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="${GITHUB_REF_NAME#release/}"
          fi
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download release build
        uses: actions/download-artifact@v4
        with:
          name: release-build
          path: .

      - name: Read OTA release notes from tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag" ]; then
            git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME" > ota-tag-message.txt
            python3 scripts/generate_ota_notes.py --input ota-tag-message.txt --output ota-notes.md
          else
            echo "::notice::OTA release notes omitted: release tag is not annotated"
          fi

      # Prefer curated notes for a named release. When none are checked in,
      # build a complete commit-level changelog. GitHub's built-in
      # generate_release_notes only lists PR merges, so any commit pushed
      # straight to main would otherwise be missing from the release body.
      - name: Build release notes
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          CURATED_NOTES=".github/release-notes/${VERSION}.md"
          if [ -f "$CURATED_NOTES" ]; then
            cp "$CURATED_NOTES" release-body.md
          else
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            {
              if [ -n "$PREV_TAG" ]; then
                echo "## Changes since ${PREV_TAG}"
                echo ""
                git log --pretty=format:"- %s (\`%h\`)" --reverse "${PREV_TAG}..HEAD"
                echo ""
                echo ""
                echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${VERSION}"
              else
                echo "## Initial release ${VERSION}"
              fi
            } > release-body.md
          fi
          if [ -s ota-notes.md ]; then
            printf '\n' >> release-body.md
            cat ota-notes.md >> release-body.md
          fi
          echo "---- release-body.md ----"
          cat release-body.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: CrossMux ${{ steps.release.outputs.version }}
          files: dist/*
          fail_on_unmatched_files: true
          body_path: release-body.md

      # Mirror the SAME binaries to Gitee so mainland-China users / device OTA
      # download from Gitee's CN CDN (see scripts/publish-gitee-release.sh).
      # GitHub is published first, but an incomplete China mirror fails this
      # workflow. Needs the GITEE_TOKEN secret (`projects` scope).
      - name: Mirror release to Gitee (China)
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          bash scripts/publish-gitee-release.sh \
            "x1abin/crossmux" \
            "${{ steps.release.outputs.version }}" \
            "CrossMux ${{ steps.release.outputs.version }}" \
            "false" \
            "${{ github.sha }}" \
            "release-body.md" \
            dist/firmware.bin dist/firmware-cn.bin dist/bootloader.bin dist/partitions.bin

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CrossMux-${{ steps.release.outputs.version }}
          path: |
            dist/CrossMux.SyncService-win-x64.zip
            dist/CrossMux.SyncService-linux-x64.tar.gz
            dist/SHA256SUMS.txt
            .pio/build/gh_release/bootloader.bin
            .pio/build/gh_release/firmware.bin
            .pio/build/gh_release/firmware.elf
            .pio/build/gh_release/firmware.map
            .pio/build/gh_release/partitions.bin
            .pio/build/gh_release_cn/firmware.bin
